<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#4c5ed7">
    <title>Đăng nhập giáo viên · LanExam</title>
    <link rel="stylesheet" href="/styles.css?v=20261105-usertable1">
  </head>
  <body>
    <main class="login-wrap">
      <section class="hero">
        <span class="eyebrow">KHÔNG GIAN GIÁO VIÊN</span>
        <h1>Chào mừng trở lại.</h1>
        <p>Đăng nhập để tiếp tục quản lý ngân hàng câu hỏi, đề thi và phòng thi.</p>
      </section>
      <section class="entry-side">
        <div class="login-card">
          <a class="back-link" href="/">Trang chủ</a>
          <h1>Giáo viên</h1>
          <p>Dùng tài khoản được cấp bởi quản trị viên.</p>
          <form id="loginForm">
            <label class="field">Địa chỉ máy chủ
              <input name="base" value="" required placeholder="http://192.168.1.10:8000">
            </label>
            <label class="field">Tên đăng nhập
              <input name="username" autocomplete="username" required>
            </label>
            <label class="field">Mật khẩu
              <input name="password" type="password" autocomplete="current-password" required>
            </label>
            <div id="loginError" class="error" role="alert"></div>
            <button class="primary" type="submit">Đăng nhập</button>
          </form>
        </div>
      </section>
    </main>
    <script src="/auth-pages.js?v=20261105-usertable1" defer></script>
  </body>
</html>
