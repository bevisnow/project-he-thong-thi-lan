<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Ngân hàng câu hỏi · LanExam</title>
    <link rel="stylesheet" href="/styles.css?v=20261123-exam-form-panels" />
  </head>

  <body data-page="questions">
    <div id="app"></div>
    <div id="toast" role="status" aria-live="polite"></div>
    <div id="modal" class="veil hidden"></div>

    <template id="pageTemplate">
      <div class="heading">
        <div>
          <span class="eyebrow">THƯ VIỆN HỌC LIỆU</span>
          <h1>Ngân hàng câu hỏi</h1>
          <p>Tìm kiếm, lọc và quản lý câu hỏi theo chương trình học.</p>
        </div>
        <div class="heading-actions">
          <button class="secondary" data-action="import-questions">Nhập file Word (.docx)</button>
          <button class="primary" data-action="new-question">Thêm câu hỏi</button>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Phạm vi kiến thức</h2>
            <p>Chọn môn và khối trước khi lọc chủ đề, bài học.</p>
          </div>
        </div>
        <div class="panel-body filters">
          <label class="field">
            Môn học
            <select id="qSubject">
              <option value="">Tất cả môn</option>
              {{SUBJECT_OPTIONS}}
            </select>
          </label>
          <label class="field">
            Khối lớp
            <select id="qGrade">
              <option value="">Tất cả khối</option>
              {{GRADE_OPTIONS}}
            </select>
          </label>
          <label class="field">
            Chủ đề
            <select id="qTopic">
              <option value="">Tất cả chủ đề</option>
            </select>
          </label>
          <label class="field">
            Bài học
            <select id="qLesson">
              <option value="">Tất cả bài học</option>
            </select>
          </label>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">
          <div>
            <h2>Danh sách câu hỏi</h2>
            <p>File nhập câu hỏi: Word (.docx)</p>
          </div>
        </div>
        <div class="toolbar">
          <input id="qSearch" aria-label="Tìm nội dung câu hỏi" placeholder="Tìm nội dung câu hỏi..." />
          <select id="qType" aria-label="Dạng câu">
            <option value="">Tất cả dạng câu</option>
            {{TYPE_OPTIONS}}
          </select>
          <select id="qDiff" aria-label="Mức độ">
            <option value="">Mọi mức độ</option>
            {{DIFFICULTY_OPTIONS}}
          </select>
        </div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>NỘI DUNG</th>
                <th>MÔN / KHỐI</th>
                <th>DẠNG CÂU</th>
                <th>MỨC ĐỘ</th>
                <th>CHIA SẺ</th>
                <th>TRẠNG THÁI</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="questionRows">
              <tr>
                <td colspan="7" class="empty">Đang tải...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </template>

    <link rel="stylesheet" href="/vendor/katex/katex.min.css" />
    <script src="/vendor/katex/katex.min.js" defer></script>
    <script src="/app.js?v=20261123-exam-form-panels" defer></script>
    <script src="/exam-ui.js?v=20261123-exam-form-panels" defer></script>
    <script src="/room-config.js?v=20261123-exam-form-panels" defer></script>
  </body>
</html>
