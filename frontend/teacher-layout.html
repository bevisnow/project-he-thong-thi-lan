<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard · LanExam</title>
    <link rel="stylesheet" href="/styles.css?v=20261123-exam-form-panels" />
  </head>
  <body>
    <template id="layoutTemplate">
      <div class="shell">
        <aside class="sidebar">
          <div class="brand">
            <div>
              <b>LanExam</b>
              <small>HỆ THỐNG THI TRỰC TUYẾN</small>
            </div>
          </div>

          <div class="profile">
            <div class="avatar">{{INITIALS}}</div>
            <div class="profile-info">
              <strong>{{FULL_NAME}}</strong>
              <small>{{USERNAME}}</small>
            </div>
          </div>

          <p class="nav-label">Dashboard giáo viên</p>
          <nav class="sidebar-nav" aria-label="Điều hướng">
            <button class="nav" data-page="dashboard">
              <span>Tổng quan</span>
            </button>
            <button class="nav" data-page="questions">
              <span>Ngân hàng câu hỏi</span>
            </button>
            <button class="nav" data-page="createExam">
              <span>Tạo đề</span>
            </button>
            <button class="nav" data-page="exams">
              <span>Đề đã tạo</span>
            </button>
            <button class="nav" data-page="shuffle">
              <span>Trộn đề</span>
            </button>
            <button class="nav" data-page="rooms">
              <span>Phòng thi</span>
            </button>
            <button class="nav" data-page="classes">
              <span>Lớp học</span>
            </button>
            <button class="nav" data-page="users" data-admin-only>
              <span>Tài khoản giáo viên</span>
            </button>
          </nav>

          <div class="sidebar-footer">
            <button class="link-button" data-action="logout" title="Đăng xuất">
              <span class="nav-icon" aria-hidden="true"></span>
              <span>Đăng xuất</span>
            </button>
          </div>
        </aside>
        <main class="main">
          <header class="topbar">
            <span>Dashboard giáo viên　/　<b>{{PAGE_TITLE}}</b></span>
          </header>
          <section class="content">{{BODY}}</section>
        </main>
      </div>
    </template>
  </body>
</html>
